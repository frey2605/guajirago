# ══════════════════════════════════════════════════════════════════════════════════════════════
#  EL BOTÓN DE LA NUBE (functions) — orden del dueño (23-sep-2026). El QUINTO y último de los
#  cinco: con éste, todo lo que hay que desplegar en GuajiraGo tiene botón.
#
#  QUÉ RESUELVE. `guajirago/functions/index.js` exporta **19 funciones**, y son las que de verdad
#  mueven el negocio: avisan al conductor de un viaje nuevo, confirman al conductor, cierran los
#  viajes colgados, canjean los códigos de recarga, cobran. Hasta hoy salían **solo desde el PC**.
#
#  🔴 ES UN BOTÓN APARTE, Y ESO ES A PROPÓSITO (igual que en control-elite). Se pensó en pegarle
#  un paso al botón de la app y se descartó: la app se toca casi a diario y la nube casi nunca.
#  Pegarlos obligaría a redesplegar las 19 funciones cada vez que se cambia un color, y cada
#  despliegue de funciones **las reinicia**. Separados, cada uno se aprieta cuando toca.
#
#  🔴 SE DISPARA SOLO cuando entra a `main` algo de `guajirago/functions/`, y no antes. Un cambio
#  de la app no lo despierta. Y el botón a mano se queda, para repetir sin inventar un commit.
#
#  🔑 CON NODE 22, AUNQUE LAS FUNCIONES PIDAN 24 — y no es descuido, está medido. Lo que decide la
#  versión con la que CORREN en la nube es el `engines` de su `package.json`, no la del runner. La
#  versión de aquí solo sirve para que `firebase` LEA el código y descubra los 19 disparadores, y
#  eso ya se vio funcionar: el 23-sep-2026 el emulador arrancó con node 22 y cargó las 19
#  definiciones por su nombre. Es el mismo análisis que hace el despliegue.
#
#  🔴 NUNCA `--force`. Si la nube tiene una función que el código ya no trae, el despliegue
#  OFRECE BORRARLA; sin `--force` y con `--non-interactive` no la borra, avisa. Borrar una función
#  viva es dejar sin avisos a los conductores, o sin cobrar. Si algún día avisa de eso, la
#  respuesta NO es forzarlo: es mirar por qué falta.
#
#  ⚠️ Y ESTE BOTÓN TAMPOCO PUBLICA LAS REGLAS. Las funciones corren con el SDK admin y **se saltan
#  las reglas de Firestore**, así que una función nueva puede funcionar mientras la app que la
#  acompaña se queda cerrada. Si el cambio necesita reglas, van por su botón, antes.
# ══════════════════════════════════════════════════════════════════════════════════════════════
name: Desplegar la NUBE (functions)

on:
  push:
    branches: [main]
    paths:
      - 'guajirago/functions/**'
  workflow_dispatch:

concurrency:
  group: despliegue-funciones-guajirago
  cancel-in-progress: false

jobs:
  funciones:
    name: Comprobar, probar, desplegar y VERIFICAR
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️ ¿Están los dos secretos? (antes de gastar nada)
        env:
          LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LECTURA: ${{ secrets.LEER_REPOS_HERMANOS }}
        run: |
          FALTA=0
          if [ -z "$LLAVE" ]; then
            echo "⛔ FALTA LA LLAVE DE FIREBASE (secreto: FIREBASE_SERVICE_ACCOUNT)"
            echo "   https://github.com/frey2605/guajirago/settings/secrets/actions/new"
            FALTA=1
          fi
          if [ -z "$LECTURA" ]; then
            echo "⛔ FALTA EL PERMISO DE LECTURA (secreto: LEER_REPOS_HERMANOS)"
            echo "   Sin él no se traen los otros dos repos, y sin los tres juntos nueve archivos"
            echo "   de pruebas no pueden correr: el candado del paso 5 se ablandaría sin decirlo."
            echo "   🔴 Y CADUCA: si esto fallaba antes y ahora no, es eso."
            FALTA=1
          fi
          [ "$FALTA" = "0" ] || exit 1
          echo "✅ Los dos secretos están."

      - name: Traer el código
        uses: actions/checkout@v4

      - name: Traer guajirago-admin (el otro lado de los contratos)
        uses: actions/checkout@v4
        with:
          repository: frey2605/guajirago-admin
          token: ${{ secrets.LEER_REPOS_HERMANOS }}
          path: guajirago-admin
          persist-credentials: false

      - name: Traer guajirago-aliados (el otro lado de los contratos)
        uses: actions/checkout@v4
        with:
          repository: frey2605/guajirago-aliados
          token: ${{ secrets.LEER_REPOS_HERMANOS }}
          path: guajirago-aliados
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java (lo necesita el emulador de las pruebas)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar las librerías de las pruebas
        run: npm ci

      #  🔴 LAS DE LA NUBE, Y VAN ANTES DEL VIGÍA. `firebase` LEE el código de las funciones para
      #  descubrir los disparadores; sin sus librerías falla por FALTA DE LIBRERÍAS, no por
      #  permisos — y eso sería una falsa alarma puesta por mí. (Es la misma razón, y el mismo
      #  orden, que en control-elite.)
      - name: Instalar las librerías de la nube
        run: npm ci --prefix guajirago/functions

      # ── ⏱️ VIGÍA DE PERMISOS · REGLA 1407, ANTES DE LAS PRUEBAS ────────────────────────────
      #  Preguntarle a Google si la llave puede tarda segundos; las pruebas tardan minutos.
      #  De dónde sale (control-elite, 21-sep-2026): subir la nube costó CUATRO viajes del dueño a
      #  la consola porque los permisos salían de uno en uno, y CADA intento corría las pruebas
      #  enteras antes de morir. Las pruebas no causaron la demora: la multiplicaron por cuatro.
      #
      #  🔑 Y NO PUEDE DAR FALSA ALARMA: solo PARA si lo que Google contesta habla de un permiso.
      #  Cualquier otro tropiezo —que `--dry-run` no exista en esta versión, que la red falle—
      #  avisa y SIGUE: el despliegue de verdad es quien manda. Un vigía que grita sin fuego se
      #  deja de mirar, y éste protege al que más falta hace.
      #
      #  ⚠️ NO COMPRUEBA TODOS LOS PERMISOS, y se dice en vez de presumirlo: el simulacro hace el
      #  mismo arranque que el despliegue —lee la llave, mira el proyecto, toca Secret Manager—
      #  pero NO pone ninguna función, así que no caza lo que solo falla al ESCRIBIR (los relojes
      #  de Cloud Scheduler, por ejemplo). Caza lo de la puerta, que es donde se muere casi siempre.
      - name: ⏱️ ¿Esta llave PUEDE subir funciones? (segundos, antes de las pruebas)
        env:
          LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$LLAVE" > "$RUNNER_TEMP/llave.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/llave.json"
          set +e
          SALIDA=$(npx --yes firebase-tools@15 deploy --only functions \
            --project guajirago --non-interactive --dry-run 2>&1)
          CODIGO=$?
          set -e
          rm -f "$RUNNER_TEMP/llave.json"
          if [ "$CODIGO" -eq 0 ]; then
            echo "✅ La llave puede subir funciones. Se sigue a las pruebas."
            exit 0
          fi
          echo "$SALIDA"
          echo ""
          if echo "$SALIDA" | grep -qiE "permission|permisos|403|401|denied|PERMISSION_DENIED|lacks IAM|Please ask a project owner|invalid_grant|Failed to authenticate|has not been used|is disabled"; then
            echo "⛔ LA LLAVE NO PUEDE SUBIR LAS FUNCIONES. Se para aquí, ANTES de gastar las"
            echo "   pruebas en un despliegue que iba a morir igual. Arriba está lo que dijo Google."
            echo ""
            echo "   La cuenta publicar-desde-claude necesita estos roles, en:"
            echo "   https://console.cloud.google.com/iam-admin/iam?project=guajirago"
            echo "     · Usuario de cuenta de servicio       · Administrador de Secret Manager"
            echo "     · Administrador de Cloud Functions    · Editor de Cloud Build"
            echo "     · Administrador de Cloud Scheduler    · Administrador de Artifact Registry"
            echo "   Y el servicio «cloudbilling» tiene que estar HABILITADO:"
            echo "   https://console.cloud.google.com/apis/library/cloudbilling.googleapis.com?project=guajirago"
            echo ""
            echo "   🔴 Hoy esa cuenta solo tiene Administrador de Firebase Hosting y Lector de"
            echo "      Cloud Datastore. Con eso publica la APP, no la nube."
            exit 1
          fi
          echo "::warning title=El vigía de permisos no pudo comprobar::El simulacro falló por algo"
          echo "que NO parece un permiso. NO se para: el despliegue de verdad decide."
          echo "🔁 SE SIGUE."

      # ── PASO 5 · PROBAR — EL CANDADO ───────────────────────────────────────────────────────
      - name: Correr TODAS las pruebas (si una falla, aquí se para)
        run: npm test

      # ── PASO 10 · APLICAR ───────────────────────────────────────────────────────────────────
      #  Desde dentro de `guajirago/`, cuyo `firebase.json` declara estas funciones con su
      #  `codebase` y su `disallowLegacyRuntimeConfig`. (El de la RAÍZ también las declara, más
      #  escueto; se usa el de la app porque es el que lleva la configuración completa, y porque
      #  el paso 10 de las leyes dice «desde dentro de la carpeta de cada app».)
      #  🔴 SIN `--force`, a propósito y para siempre: es lo que convierte «ofrece borrar una
      #  función» en «la borra».
      - name: Desplegar la nube (desde dentro de guajirago/)
        working-directory: guajirago
        env:
          LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$LLAVE" > "$RUNNER_TEMP/llave.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/llave.json"
          npx --yes firebase-tools@15 deploy --only functions \
            --project guajirago --non-interactive
          rm -f "$RUNNER_TEMP/llave.json"

      # ── PASO 11 · VERIFICAR CONTRA LA NUBE ─────────────────────────────────────────────────
      #  Que el despliegue diga «listo» no es prueba de nada. Aquí se le pregunta a la nube QUÉ
      #  FUNCIONES TIENE, y se exige que estén TODAS las que exporta el código. Un despliegue a
      #  medias —algunas sí y otras no— es exactamente lo que este paso existe para cazar.
      #  🔑 La lista de nombres NO se escribe aquí: se saca de `index.js`, que es quien la decide.
      #  Copiarla en este archivo sería el gemelo que se queda viejo: se añade una función, nadie
      #  actualiza el YAML, y el paso 11 firma en verde sin haberla mirado.
      - name: Preguntarle a la nube si están las 19
        env:
          LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          ESPERADAS=$(grep -oE '^exports\.[a-zA-Z0-9_]+' guajirago/functions/index.js \
            | sed 's/exports\.//' | sort -u)
          CUANTAS=$(echo "$ESPERADAS" | grep -c .)
          if [ "$CUANTAS" -eq 0 ]; then
            echo "⛔ No se pudo leer ninguna función exportada de index.js."
            echo "   Sin saber qué se esperaba, esta comprobación sería un adorno: se para."
            exit 1
          fi
          echo "El código exporta $CUANTAS funciones."

          printf '%s' "$LLAVE" > "$RUNNER_TEMP/llave.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/llave.json"
          PUESTAS=$(npx --yes firebase-tools@15 functions:list --project guajirago 2>&1)
          rm -f "$RUNNER_TEMP/llave.json"
          echo "$PUESTAS"

          FALTAN=""
          for f in $ESPERADAS; do
            echo "$PUESTAS" | grep -qw "$f" || FALTAN="$FALTAN $f"
          done

          if [ -n "$FALTAN" ]; then
            echo ""
            echo "⛔ LA NUBE NO TIENE TODAS LAS FUNCIONES DEL CÓDIGO. Faltan:"
            for f in $FALTAN; do echo "     · $f"; done
            echo ""
            echo "   Un despliegue a medias deja parte del negocio sin funcionar y no da error."
            {
              echo "## ⛔ Faltan funciones en la nube"
              echo ""
              for f in $FALTAN; do echo "- \`$f\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo ""
          echo "✅ Las $CUANTAS funciones del código están puestas en la nube."
          {
            echo "## ✅ La nube desplegada y comprobada"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Funciones del código | $CUANTAS |"
            echo "| Puestas en la nube | las $CUANTAS |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo ""
            echo "> No se le creyó al despliegue: se le preguntó a la nube qué funciones tiene,"
            echo "> y se comparó contra las que exporta \`index.js\`."
            echo ""
            echo "> ⚠️ Este botón publica **la nube**, no las reglas. Las funciones se saltan las"
            echo "> reglas de Firestore, así que una función nueva puede andar mientras la app que"
            echo "> la acompaña se queda cerrada. Si el cambio necesitaba reglas, iban antes."
          } >> "$GITHUB_STEP_SUMMARY"
